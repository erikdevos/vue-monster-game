name: Deploy v2 to GitHub Pages

# Deploys v2 on every push to `main`, and by hand (Actions tab, "Run workflow").
#
# One-time setup in GitHub: Settings > Pages > Source: "GitHub Actions". Until that is set,
# the deploy step fails (nothing is broken: set it, then re-run the workflow).
#
# Deploying replaces what the Pages site served before, the legacy version from the repo
# root. The checks run first, so a red build is never published.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
